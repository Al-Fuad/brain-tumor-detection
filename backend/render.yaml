services:
  - type: web
    name: brain-tumor-backend
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: ../ml/artifacts/brain-tumor-detection-model.keras
      - key: CORS_ORIGINS
        value: "*"
